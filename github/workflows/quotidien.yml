name: Analyse quotidienne

on:
  schedule:
    - cron: "0 0 * * *"      # chaque jour à minuit : 00:00 UTC = 00:00 heure de la Côte d'Ivoire
  workflow_dispatch:          # permet de lancer à la main depuis l'onglet Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scoutfoot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Résultats des matchs terminés
        continue-on-error: true
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python mise_a_jour_resultats.py

      - name: Analyse du jour
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python analyse_du_jour_fd.py --date "$(date -u +%F)"

      - name: Analyse des sélections nationales (API-Football)
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -n "$API_FOOTBALL_KEY" ]; then
            python analyse_apifootball.py --date "$(date -u +%F)"
          else
            echo "Secret API_FOOTBALL_KEY absent : étape ignorée."
          fi

      - name: Fusionner clubs et sélections
        run: python fusionner.py

      - name: Rapport de fiabilité
        run: |
          {
            echo '### Rapport de fiabilité'
            echo '```'
            python mise_a_jour_resultats.py --rapport
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer le journal des prédictions
        run: |
          git config user.name "scoutfoot-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in analyse_du_jour.json predictions.jsonl resultats.jsonl; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || { git commit -m "Analyse $(date -u +%F)"; git push; }

      - name: Préparer le site
        run: |
          mkdir public
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png analyse_du_jour.json public/
          [ -f pubs.json ] && cp pubs.json public/ || true
          [ -f reglages.json ] && cp reglages.json public/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
