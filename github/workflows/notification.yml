name: Notification quotidienne

on:
  schedule:
    - cron: "30 6 * * *"      # chaque jour à 06:30 UTC (= 06:30 en Côte d'Ivoire), après l'analyse de minuit
  workflow_dispatch:           # lancement manuel possible depuis l'onglet Actions

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Envoyer le Top 3 du jour sur Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://arnaudkore88-sys.github.io/scoutfoot/
        run: python notifier_telegram.py
